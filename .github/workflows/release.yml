name: Release

# Builds, signs, verifies, and publishes a release APK when a version tag is pushed.
# Signing material comes only from repository secrets (AGENTS.md rule 5):
#   MARQUE_KEYSTORE_BASE64, MARQUE_KEYSTORE_PASSWORD, MARQUE_KEY_ALIAS, MARQUE_KEY_PASSWORD

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Sign and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        env:
          MARQUE_KEYSTORE_BASE64: ${{ secrets.MARQUE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MARQUE_KEYSTORE_BASE64" ]; then
            echo "::error::MARQUE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$MARQUE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: ktlint, unit tests, signed release build
        env:
          MARQUE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MARQUE_KEYSTORE_PASSWORD: ${{ secrets.MARQUE_KEYSTORE_PASSWORD }}
          MARQUE_KEY_ALIAS: ${{ secrets.MARQUE_KEY_ALIAS }}
          MARQUE_KEY_PASSWORD: ${{ secrets.MARQUE_KEY_PASSWORD }}
        run: ./gradlew ktlintCheck testDebugUnitTest assembleRelease

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "marque-${{ github.ref_name }}.apk"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "marque-${{ github.ref_name }}.apk" --generate-notes --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
