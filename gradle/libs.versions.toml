# Single source of truth for dependency and plugin versions (AGENTS.md rule 3).
# Verified against Google Maven / Maven Central metadata and official release notes on 2026-09-15.

[versions]
# Build tooling
agp = "9.4.0"                 # developer.android.com/build/releases/gradle-plugin — requires Gradle >= 9.6.0, JDK 17
kotlin = "2.4.20"             # github.com/JetBrains/kotlin/releases — KGP 2.4.20 supports Gradle 7.6.3–9.7.0
ksp = "2.3.12"                # github.com/google/ksp/releases — KSP is versioned independently of Kotlin since 2.3.x
hilt = "2.60.1"               # github.com/google/dagger/releases — Hilt Gradle plugin requires AGP >= 9.0
ktlintGradle = "14.2.0"       # plugins.gradle.org/plugin/org.jlleitschuh.gradle.ktlint
ktlint = "1.8.0"              # com.pinterest.ktlint:ktlint-cli — pinned so the plugin default cannot drift

# AndroidX / Compose
# compileSdk is pinned to 36. The newest stable AndroidX trains (compose 1.12.x, core 1.19.0,
# lifecycle 2.11.0, hilt-navigation-compose 1.4.0, navigation 2.10.x) declare minCompileSdk=37 in
# their AAR metadata, so the versions below are the latest stable ones whose minCompileSdk <= 36.
compose-bom = "2026.06.01"    # maps to compose ui/foundation/runtime 1.11.4, material3 1.4.0
activity-compose = "1.13.0"
lifecycle = "2.10.0"
androidx-hilt = "1.3.0"       # hilt-lifecycle-viewmodel-compose + hilt-navigation-compose share a train
navigation-compose = "2.9.8"
room = "2.8.5"
core-ktx = "1.18.0"

# Networking / serialization
retrofit = "3.0.0"
okhttp = "5.4.0"                # 5.5.0's okhttp-android AAR declares minCompileSdk=37; 5.4.0 is the newest with minCompileSdk<=36
kotlinx-serialization = "1.11.0"

# Testing
kotlinx-coroutines = "1.11.0"
mockwebserver = "5.4.0"       # com.squareup.okhttp3:mockwebserver3 (OkHttp 5 renamed artifact and package); kept in lockstep with okhttp
turbine = "1.2.1"
junit4 = "4.13.2"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
robolectric = "4.17"

[libraries]
# Core / Compose
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# BOM-managed (1.7.8; minCompileSdk=34). Only the core set: back, search, clear.
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidx-hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "androidx-hilt" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Networking / serialization
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

# Testing
junit4 = { group = "junit", name = "junit", version.ref = "junit4" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockwebserver3 = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "mockwebserver" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
